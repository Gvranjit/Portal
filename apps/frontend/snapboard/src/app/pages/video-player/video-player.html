<div class="video-player-page">
  <ng-container *ngIf="videoSources.length > 0; else noVideo">
    <h2>{{ videoTitle }}</h2>

    <vg-player [ngStyle]="{'width.%': 100, 'height': '600px'}" preload="auto">
      <!-- <video
        #media
        vgMedia
        [vgMedia]="media"
        [src]="videoSources[0]"
        type="video/mp4"
      ></video> -->

      <vg-controls></vg-controls>
      <vg-overlay-play></vg-overlay-play>
      <vg-buffering></vg-buffering>
    </vg-player>
  </ng-container>

  <ng-template #noVideo>
    <p>No video selected. Use /video/:videoId with a valid filename.</p>
  </ng-template>
</div>
